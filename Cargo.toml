[package]
name = "hydromancer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Async Rust client for the Hydromancer REST API: Hyperliquid positions, fills, liquidations and candles"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hydromancerxyz/hydromancer-rs"
homepage = "https://docs.hydromancer.xyz"
documentation = "https://docs.rs/hydromancer"
keywords = ["hyperliquid", "hydromancer", "trading", "market-data", "api-client"]
categories = ["api-bindings", "finance"]
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
fastrand = "2.3"
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "2.0"
tokio = { version = "1.38", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
